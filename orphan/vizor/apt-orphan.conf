// Orphan: keep installs lean on the S9 board (512 MB RAM, a few GB of SD), and refresh VIZOR's program menus
// after every install or removal (new programs show up in the X desktop menus by themselves).
APT::Install-Recommends "false";
DPkg::Post-Invoke { "if [ -x /usr/bin/python3 ] && [ -f /usr/local/share/orphan/vizor/xapps.py ]; then python3 /usr/local/share/orphan/vizor/xapps.py --jwm >/dev/null 2>&1 || true; fi"; };
