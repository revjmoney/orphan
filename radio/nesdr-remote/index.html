<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orphan Radio · Network NESDR</title>
<style>
:root{color-scheme:dark;background:#10161a;color:#e5eee8;font:15px system-ui}*{box-sizing:border-box}
body{margin:0}main{padding:16px;margin:auto;max-width:1150px}h1{color:#efc072;margin:0 0 12px;font-size:24px}
form{display:flex;align-items:end;flex-wrap:wrap;gap:10px}label{display:grid;gap:5px;color:#bbcbc5}
input,select,button{font:inherit;min-height:40px;padding:7px 10px;border:1px solid #526560;background:#1d2a2e;color:inherit;border-radius:5px}
button{cursor:pointer}#start{background:#edbd6c;color:#161510}#status{color:#9cdbc3}
.modes{flex:1 0 100%;min-width:0;margin:2px 0 0;padding:0;border:0}
.modes legend{color:#bbcbc5;padding:0;margin-bottom:5px}.mode-keys{display:flex;flex-wrap:wrap;gap:6px}
.mode-keys button[aria-pressed="true"]{color:#ffe2a6;border-color:#edbd6c;background:#30271c}
canvas{display:block;width:100%;background:#0a1015;border:1px solid #334641} #waterfall{height:160px;image-rendering:pixelated}
.axis{display:flex;justify-content:space-between;color:#bbcbc5;font:12px monospace;margin:6px 0 14px}
</style>
<main>
<h1>Network NESDR</h1>
<form id="tuner"><label>Frequency (MHz)<input id="frequency" type="number" value="99.5" min="0.1" max="1750" step="0.000001" required></label>
<label>RF gain<select id="rf"><option value="">Auto</option></select></label><button>Tune</button>
<button type="button" id="start">Start receiver</button><button type="button" id="stop">Stop</button>
<label>Volume<input id="volume" type="range" min="0" max="1" step="0.01" value="0.45"></label>
<fieldset class="modes"><legend>Receive mode</legend><div class="mode-keys">
<button type="button" data-mode="wfm" aria-pressed="true">Broadcast FM</button><button type="button" data-mode="nfm" aria-pressed="false">Narrow FM</button>
<button type="button" data-mode="am" aria-pressed="false">AM</button><button type="button" data-mode="sam" aria-pressed="false">Sync AM</button>
<button type="button" data-mode="usb" aria-pressed="false">USB</button><button type="button" data-mode="lsb" aria-pressed="false">LSB</button><button type="button" data-mode="cw" aria-pressed="false">CW</button>
</div></fieldset></form>
<p id="status" role="status">Ready to receive</p>
<canvas id="spectrum" width="768" height="170" aria-label="Live radio spectrum"></canvas>
<div class="axis"><span id="lo"></span><span id="center"></span><span id="hi"></span></div>
<canvas id="waterfall" width="768" height="160" aria-label="Radio spectrum history"></canvas>
</main>
<script>
const el=id=>document.getElementById(id);
const spectrum=el('spectrum'),waterfall=el('waterfall');
const trace=spectrum.getContext('2d'),history=waterfall.getContext('2d');
const N=512,windowing=Float32Array.from({length:N},(_,i)=>0.5-0.5*Math.cos(2*Math.PI*i/(N-1)));
const real=new Float32Array(N),imag=new Float32Array(N),db=new Float32Array(N);
let controller,audio,volume,playAt=0,state,mode='wfm';
// USB transfers can deliver nearly half a second of samples in a burst.
// Queue enough audio to keep playback continuous between bursts.
const AUDIO_PREROLL=.70, MIN_SCHEDULE_LEAD=.008;
let audioQueue=[],queuedSeconds=0,underruns=0,plotFrame=0,latestSpectrum;
const sources=new Set();
const modeKeys=[...document.querySelectorAll('[data-mode]')];
function selectMode(value){mode=value;for(const key of modeKeys)key.setAttribute('aria-pressed',key.dataset.mode===mode);}

function hzLabel(hz){return (hz/1e6).toFixed(4)+' MHz';}
function axis(){const f=state?.frequency||+el('frequency').value*1e6;
 el('lo').textContent=hzLabel(f-125000);el('center').textContent=hzLabel(f);el('hi').textContent=hzLabel(f+125000);}
function plot(packet){
 let j=0;
 for(let i=0;i<N;i++){
  real[j]=(packet[2*i]-127.5)*windowing[i];imag[j]=(packet[2*i+1]-127.5)*windowing[i];
  let step=N>>1;while(step && (j&step)){j^=step;step>>=1;}j^=step;
 }
 for(let size=2;size<=N;size*=2){
  const half=size/2;
  for(let k=0;k<half;k++){
   const angle=-2*Math.PI*k/size,co=Math.cos(angle),si=Math.sin(angle);
   for(let i=k;i<N;i+=size){const p=i+half,r=real[p]*co-imag[p]*si,q=real[p]*si+imag[p]*co;
    real[p]=real[i]-r;imag[p]=imag[i]-q;real[i]+=r;imag[i]+=q;}
  }
 }
 for(let i=0;i<N;i++){const bin=(i+N/2)%N;db[i]=20*Math.log10(Math.hypot(real[bin],imag[bin])/(N*32)+1e-6);}
 const w=spectrum.width,h=spectrum.height;
 trace.fillStyle='#0a1015';trace.fillRect(0,0,w,h);trace.strokeStyle='#263a43';trace.beginPath();
 for(let i=1;i<5;i++){trace.moveTo(0,i*h/5);trace.lineTo(w,i*h/5);}
 trace.moveTo(w/2,0);trace.lineTo(w/2,h);trace.stroke();
 trace.strokeStyle='#79edc5';trace.beginPath();
 for(let i=0;i<N;i++){const y=h*(1-Math.max(0,Math.min(1,(db[i]+75)/72))),x=i*w/(N-1);if(i)trace.lineTo(x,y);else trace.moveTo(x,y);}
 trace.stroke();
 history.drawImage(waterfall,0,0,w,waterfall.height-1,0,1,w,waterfall.height-1);
 const row=history.createImageData(w,1);
 for(let x=0;x<w;x++){const v=Math.max(0,Math.min(1,(db[Math.floor(x*N/w)]+70)/60));const p=4*x;
  row.data[p]=v*v*244;row.data[p+1]=v*214;row.data[p+2]=28+v*(1-v)*255;row.data[p+3]=255;}
 history.putImageData(row,0,0);
}
function resetAudio(){
 for(const node of sources){try{node.stop();}catch(e){}}
 sources.clear();playAt=0;audioQueue=[];queuedSeconds=0;underruns=0;
 delete el('status').dataset.audioUnderruns;
}
function schedule(buffer){
 const node=audio.createBufferSource();node.buffer=buffer;node.connect(volume);sources.add(node);
 node.onended=()=>{sources.delete(node);node.disconnect();};
 node.start(playAt);playAt+=buffer.duration;
}
function play(packet){
 const count=(packet.length-state.packet_iq_bytes)/2;
 const buffer=audio.createBuffer(1,count,state.audio_rate),output=buffer.getChannelData(0);
 const pcm=new DataView(packet.buffer,packet.byteOffset+state.packet_iq_bytes,count*2);
 for(let i=0;i<count;i++)output[i]=pcm.getInt16(i*2,true)/32768;
 if(playAt && playAt<audio.currentTime+MIN_SCHEDULE_LEAD){
  playAt=0;el('status').dataset.audioUnderruns=++underruns;
 }
 if(playAt){schedule(buffer);return;}
 audioQueue.push(buffer);queuedSeconds+=buffer.duration;
 if(queuedSeconds>=AUDIO_PREROLL){
  playAt=audio.currentTime+.04;
  for(const next of audioQueue)schedule(next);
  audioQueue=[];queuedSeconds=0;
  el('status').textContent='Receiving raw I/Q at 250 kS/s · audio playing';
 }
}
function drawLatest(packet){
 latestSpectrum=packet.slice(0,2*N);
 if(!plotFrame)plotFrame=requestAnimationFrame(()=>{plotFrame=0;plot(latestSpectrum);});
}
async function request(data){
 const r=await fetch('/api',data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:undefined);
 const result=await r.json();if(!r.ok)throw Error(result.error);return result;
}
async function tune(){
 state=await request({frequency:Math.round(+el('frequency').value*1e6),mode,gain:el('rf').value===''?null:+el('rf').value});
 axis();
}
el('tuner').onsubmit=async e=>{e.preventDefault();try{await tune();el('status').textContent='Tuned to '+hzLabel(state.frequency);}catch(e){el('status').textContent=e.message;}};
for(const key of modeKeys)key.onclick=async()=>{
 const previousMode=mode;selectMode(key.dataset.mode);
 if(controller){try{state=await request({mode});}catch(e){selectMode(previousMode);el('status').textContent=e.message;}}
};
el('volume').oninput=()=>{if(volume)volume.gain.value=+el('volume').value;};
el('stop').onclick=()=>controller?.abort();
el('start').onclick=async()=>{
 if(controller || !el('tuner').reportValidity())return;
 controller=new AbortController();const signal=controller.signal;
 try{
  if(!audio){audio=new AudioContext();volume=audio.createGain();volume.gain.value=+el('volume').value;volume.connect(audio.destination);}
  await audio.resume();await tune();resetAudio();
  const res=await fetch('/stream',{signal});if(!res.ok)throw Error((await res.json()).error);
  el('status').textContent='Receiving raw I/Q · buffering audio';
  const length=state.packet_iq_bytes*6/5,packet=new Uint8Array(length);let used=0;
  const stream=res.body.getReader();
  while(true){const {done,value}=await stream.read();if(done)throw Error('PC receiver disconnected');
   for(let cursor=0;cursor<value.length;){const bytes=Math.min(length-used,value.length-cursor);packet.set(value.subarray(cursor,cursor+bytes),used);
    used+=bytes;cursor+=bytes;if(used===length){play(packet);drawLatest(packet);used=0;}}
  }
 }catch(e){el('status').textContent=signal.aborted?'Receiver stopped':e.message;}
 finally{resetAudio();if(audio)audio.suspend();controller=null;}
};
window.addEventListener('pagehide',()=>controller?.abort());
request().then(s=>{state=s;el('frequency').value=s.frequency/1e6;selectMode(s.mode);
 for(const gain of s.gains)el('rf').add(new Option((gain/10).toFixed(1)+' dB',gain));el('rf').value=s.gain??'';axis();})
 .catch(e=>{el('status').textContent=e.message;});
</script></html>
