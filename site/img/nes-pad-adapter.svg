<text x="214" y="345" fill="#7d8a7c" font-size="12" text-anchor="middle">6</text>
<circle cx="266" cy="262" r="9" fill="#080a0c" stroke="#3a463d" stroke-width="3"/>
<text x="266" y="246" fill="#7d8a7c" font-size="12" text-anchor="middle">7</text>
<circle cx="266" cy="318" r="9" fill="#080a0c" stroke="#3a463d" stroke-width="3"/>
<text x="266" y="345" fill="#7d8a7c" font-size="12" text-anchor="middle">8</text>
<circle cx="318" cy="262" r="9" fill="#c08a5a" stroke="#c08a5a" stroke-width="3"/>
<text x="318" y="246" fill="#e8efe6" font-size="12" text-anchor="middle">9</text>
<circle cx="318" cy="318" r="9" fill="#080a0c" stroke="#c08a5a" stroke-width="3"/>
<text x="318" y="345" fill="#7d8a7c" font-size="12" text-anchor="middle">10</text>
<circle cx="370" cy="262" r="9" fill="#ff5a4f" stroke="#ff5a4f" stroke-width="3"/>
<text x="370" y="246" fill="#e8efe6" font-size="12" text-anchor="middle">11</text>
<circle cx="370" cy="318" r="9" fill="#ffe14d" stroke="#ffe14d" stroke-width="3"/>
<text x="370" y="345" fill="#e8efe6" font-size="12" text-anchor="middle">12</text>
<circle cx="422" cy="262" r="9" fill="#080a0c" stroke="#c08a5a" stroke-width="3"/>
<text x="422" y="246" fill="#7d8a7c" font-size="12" text-anchor="middle">13</text>
<circle cx="422" cy="318" r="9" fill="#080a0c" stroke="#c08a5a" stroke-width="3"/>
<text x="422" y="345" fill="#7d8a7c" font-size="12" text-anchor="middle">14</text>
<circle cx="474" cy="262" r="9" fill="#ff9a2e" stroke="#ff9a2e" stroke-width="3"/>
<text x="474" y="246" fill="#e8efe6" font-size="12" text-anchor="middle">15</text>
<circle cx="474" cy="318" r="9" fill="#f4f6f2" stroke="#f4f6f2" stroke-width="3"/>
<text x="474" y="345" fill="#e8efe6" font-size="12" text-anchor="middle">16</text>
<circle cx="526" cy="262" r="9" fill="#080a0c" stroke="#3a463d" stroke-width="3"/>
<text x="526" y="246" fill="#7d8a7c" font-size="12" text-anchor="middle">17</text>
<circle cx="526" cy="318" r="9" fill="#080a0c" stroke="#3a463d" stroke-width="3"/>
<text x="526" y="345" fill="#7d8a7c" font-size="12" text-anchor="middle">18</text>
<text x="80" y="378" fill="#d2ff51" font-size="13" font-weight="700" letter-spacing="1">S9 HASHBOARD HEADER (J1..J9)</text>
<text x="80" y="398" fill="#7d8a7c" font-size="12">seen from above, pin 1 = square pad</text>
<text x="80" y="470" fill="#7d8a7c" font-size="12">brown rings: other GND pins (2, 10, 13, 14)</text>
<text x="80" y="490" fill="#7d8a7c" font-size="12">dark pins: leave unconnected (18 = EN, 3/4 = board I2C, 6/7/8/17)</text>
<circle cx="930" cy="190" r="11" fill="#c08a5a" stroke="#c08a5a" stroke-width="3"/>
<text x="930" y="217" fill="#e8efe6" font-size="11" text-anchor="middle">GND</text>
<circle cx="930" cy="250" r="11" fill="#ff5a4f" stroke="#ff5a4f" stroke-width="3"/>
<text x="930" y="277" fill="#e8efe6" font-size="11" text-anchor="middle">CLOCK</text>
<circle cx="930" cy="310" r="11" fill="#ff9a2e" stroke="#ff9a2e" stroke-width="3"/>
<text x="930" y="337" fill="#e8efe6" font-size="11" text-anchor="middle">LATCH</text>
<circle cx="930" cy="370" r="11" fill="#ffe14d" stroke="#ffe14d" stroke-width="3"/>
<text x="930" y="397" fill="#e8efe6" font-size="11" text-anchor="middle">DATA</text>
