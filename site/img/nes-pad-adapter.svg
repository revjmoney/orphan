<text x="1040" y="397" fill="#7d8a7c" font-size="11" text-anchor="middle">D4 n/c</text>
<text x="885" y="490" fill="#d2ff51" font-size="13" font-weight="700" letter-spacing="1">NES CONTROLLER SOCKET</text>
<text x="885" y="510" fill="#7d8a7c" font-size="12">front view, like the console port</text>
<text x="40" y="528" fill="#56635a" font-size="11">by JMSCNC, makers of RotatoCAM · github.com/revjmoney/orphan</text>
<text x="1200" y="528" fill="#ffb02e" font-size="11" text-anchor="end">Not tested with a NES controller, yet.</text>
