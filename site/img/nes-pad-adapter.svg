<path d="M370 318 L370 400 L860 400 L860 370 L930 370" fill="none" stroke="#080a0c" stroke-width="10" stroke-linejoin="round"/>
<path d="M370 318 L370 400 L860 400 L860 370 L930 370" fill="none" stroke="#ffe14d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M214 262 L214 200 L318 200 L318 262" fill="none" stroke="#080a0c" stroke-width="10" stroke-linejoin="round"/>
<path d="M214 262 L214 200 L318 200 L318 262" fill="none" stroke="#d2ff51" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="560" y="112" fill="#c08a5a" font-size="13" font-weight="600">pin 1 GND  -&gt;  GND</text>
<text x="560" y="142" fill="#ff5a4f" font-size="13" font-weight="600">pin 11 TXD -&gt;  CLOCK</text>
<text x="560" y="172" fill="#ff9a2e" font-size="13" font-weight="600">pin 15 RST -&gt;  LATCH</text>
<text x="560" y="392" fill="#ffe14d" font-size="13" font-weight="600">pin 12 RXD &lt;-  DATA</text>
<text x="560" y="432" fill="#f4f6f2" font-size="13" font-weight="600">pin 16 3.3 V -&gt; VCC</text>
<text x="122" y="194" fill="#d2ff51" font-size="12" font-weight="600">PLUG to GND</text>
<rect x="80" y="222" width="476" height="130" rx="6" fill="#101613" stroke="#596e3e" stroke-width="2"/>
<rect x="101" y="253" width="18" height="18" fill="#c08a5a" stroke="#c08a5a" stroke-width="3"/>
<text x="110" y="246" fill="#e8efe6" font-size="12" text-anchor="middle">1</text>
<circle cx="110" cy="318" r="9" fill="#080a0c" stroke="#c08a5a" stroke-width="3"/>
